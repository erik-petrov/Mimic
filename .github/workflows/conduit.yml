# Builds Conduit on Windows, checks that launch at startup works, and publishes Conduit.exe as a
# downloadable artifact. Pushing a tag like v2.4.0 also publishes it as a GitHub Release.
name: Build Conduit

on:
  push:
    branches: ["**"]
    paths:
      - "conduit/**"
      - ".github/workflows/conduit.yml"
    # Path filters don't apply to tags: every v* tag builds and releases.
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      # A release's tag has to match the version Conduit shows, so nobody ships a mislabeled build.
      - name: Check the tag matches Conduit's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content conduit/Program.cs -Raw), 'VERSION = "([^"]+)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match VERSION $version in conduit/Program.cs" }

      - name: Restore packages
        run: nuget restore conduit/Conduit.sln

      # Conduit targets .NET Framework 4.6.1, whose build files are no longer installed on the
      # runners. Microsoft publishes them as a NuGet package, which the build is pointed at.
      - name: Get .NET Framework 4.6.1 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory refs

      - name: Build
        run: msbuild conduit/Conduit.sln /p:Configuration=Release /m "/p:TargetFrameworkRootPath=$env:GITHUB_WORKSPACE\refs\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build"

      - name: Check launch at startup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File conduit\Tests\check-autostart.ps1 -Exe conduit\bin\Release\Conduit.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Conduit
          path: conduit/bin/Release/Conduit.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Conduit

      - name: Checksum
        run: sha256sum Conduit.exe > Conduit.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Conduit.exe
            Conduit.exe.sha256
          generate_release_notes: true
