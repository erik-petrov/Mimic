# Hosts the Mimic web app and Rift, the relay between phones and Conduit, on one address.
# The app is served at / and Rift at /mobile, /conduit, /register and /check.
#
#   docker compose up -d --build
#       Serves both on port 8080 (or MIMIC_PORT). Point your own reverse proxy at it,
#       with websockets allowed. Then set Conduit's server to your address.
#
#   docker compose --profile caddy up -d --build
#       Also runs Caddy on ports 80 and 443, which gets an HTTPS certificate for
#       MIMIC_DOMAIN automatically. Use this if you don't already have a reverse proxy.
#
# Settings go in a .env file next to this one, e.g.:
#   MIMIC_PORT=8080
#   MIMIC_DOMAIN=mimic.example.com

services:
  web:
    build:
      context: ./web
      args:
        # "/" makes the app use the Rift below. Set MIMIC_RIFT_URL=wss://rift.mimic.lol
        # in .env to use the shared Rift instead.
        RIFT_URL: ${MIMIC_RIFT_URL:-/}
    image: mimic-web
    restart: unless-stopped
    depends_on:
      - rift
    ports:
      - "${MIMIC_PORT:-8080}:80"

  rift:
    build: ./rift
    image: mimic-rift
    restart: unless-stopped
    environment:
      AUTOPICK_LOCK_IN_DELAY: ${MIMIC_AUTOPICK_LOCK_IN_DELAY:-0}
    # Keeps registered codes and the JWT secret that signs them across rebuilds.
    volumes:
      - rift_data:/data

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MIMIC_DOMAIN: ${MIMIC_DOMAIN:-}
    # Stop with a clear message instead of a Caddyfile error when the domain is missing.
    command:
      - sh
      - -c
      - '[ -n "$$MIMIC_DOMAIN" ] || { echo "Set MIMIC_DOMAIN in the .env file, e.g. MIMIC_DOMAIN=mimic.example.com"; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  rift_data:
  caddy_data:
  caddy_config:
