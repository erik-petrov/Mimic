map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Rift's paths go to the "rift" container from compose.yaml, so the app and Rift share
    # one address. Rift is looked up per request, so this container also starts without it.
    location ~ ^/(mobile|conduit|register|check|settings)$ {
        resolver 127.0.0.11 valid=30s;
        set $rift http://rift:51001;
        proxy_pass $rift;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # The page and the service worker must be revalidated so phones pick up new builds.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else has a content hash in its name or rarely changes.
    location / {
        try_files $uri $uri/ =404;
    }
}
