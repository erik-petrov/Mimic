server {
    listen 80;
    root /usr/share/nginx/html;

    # The page and the service worker must be revalidated so phones pick up new builds.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else has a content hash in its name or rarely changes.
    location / {
        try_files $uri $uri/ =404;
    }
}
